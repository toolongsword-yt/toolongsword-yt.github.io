<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TooLongSwordYT</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f1115;
            color: #ffffff;
        }

        header {
            padding: 24px 8%;
            border-bottom: 1px solid #252932;
            background: #14171d;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            margin: 8px 0 0;
            color: #9da3ae;
        }

        main {
            width: 84%;
            max-width: 1100px;
            margin: 50px auto;
        }

        .hero {
            margin-bottom: 50px;
        }

        .hero h2 {
            font-size: 42px;
            margin-bottom: 12px;
        }

        .hero p {
            color: #b7bdc8;
            font-size: 18px;
        }

        .projects {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .project {
            display: block;
            padding: 25px;
            background: #181b22;
            border: 1px solid #292e38;
            border-radius: 12px;
            color: white;
            text-decoration: none;
            transition: 0.2s;
        }

        .project:hover {
            transform: translateY(-4px);
            border-color: #4b5563;
            background: #1d2129;
        }

        .project h3 {
            margin-top: 0;
            font-size: 22px;
        }

        .project p {
            color: #9da3ae;
            line-height: 1.5;
        }

        footer {
            margin-top: 80px;
            padding: 25px;
            text-align: center;
            border-top: 1px solid #252932;
            color: #777e89;
        }
    </style>
</head>

<body>

<header>
    <h1>TooLongSwordYT</h1>
    <p>Projects, tools and experiments.</p>
</header>

<main>

    <section class="hero">
        <h2>Welcome.</h2>
        <p>
            This is the official website of TooLongSwordYT.
        </p>
    </section>

    <section>
        <h2>Projects</h2>

        <div class="projects">

            <a class="project" href="./placeholder/">
                <h3>Place Holder</h3>
                <p>A placeholder project.</p>
            </a>

            <!-- Yeni projeleri buraya ekleyebilirsin -->

        </div>
    </section>

</main>

<footer>
    © 2026 ToolLongSwordYT
</footer>

</body>
</html>
