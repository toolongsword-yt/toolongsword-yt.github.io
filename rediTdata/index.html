<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>rediTdata</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗡️</text></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; color: #eee; font-family: system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; }
    img { max-width: 100%; max-height: 80vh; border-radius: 8px; box-shadow: 0 4px 24px rgba(0,0,0,.5); }
    .meta { margin-top: 1rem; font-size: .8rem; opacity: .5; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 1rem; max-width: 600px; width: 100%; }
    .grid a { display: block; aspect-ratio: 1; border-radius: 8px; overflow: hidden; border: 1px solid #333; }
    .grid img { width: 100%; height: 100%; object-fit: cover; }
    h1 { font-size: 1.2rem; margin-bottom: 1.5rem; opacity: .7; }
    .err { color: #f66; }
  </style>
</head>
<body>
<script>
  console.log('URL:', location.href);
(async () => {
  const params = new URLSearchParams(location.search);
  const id = params.get('d');
  const res = await fetch('data.txt');
  const lines = (await res.text()).split('\n').filter(l => l.trim());

  function toBlobUrl(uri) {
    const [header, data] = uri.split(',');
    const mime = header.match(/data:([^;]+)/)?.[1] || 'application/octet-stream';
    const clean = data.replace(/[\r\n\s]/g, '');  // ← BU SATIR
    const bytes = header.includes('base64') ? atob(clean) : decodeURIComponent(clean);
    const arr = new Uint8Array(bytes.length);
    for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
    return URL.createObjectURL(new Blob([arr], { type: mime }));
  }   

  if (id !== null) {
    // Tek image göster
    const uri = lines[+id];
    if (!uri) return document.body.innerHTML = '<p class="err">Bulunamadı: #' + id + '</p>';
    const blob = toBlobUrl(uri);
    document.body.innerHTML = `<img src="${blob}" alt="data #${id}"><p class="meta">#${id} · ${lines.length} toplam</p>`;
  } else {
    // Galeri (tümünü listele)
    const grid = document.createElement('div');
    grid.className = 'grid';
    lines.forEach((uri, i) => {
      const a = document.createElement('a');
      a.href = '?d=' + i;
      const img = document.createElement('img');
      img.src = toBlobUrl(uri);
      img.alt = '#' + i;
      img.loading = 'lazy';
      a.appendChild(img);
      grid.appendChild(a);
    });
    document.body.innerHTML = '<h1>rediTdata</h1>';
    document.body.appendChild(grid);
  }
})();
</script>
</body>
</html>
